name: Personal Health API CI

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches:
      - "hu-*-dev"
      - "qa/*"
      - "release/*"
      - "hotfix/*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret-do-not-use-in-deployments
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate container configuration
        run: docker compose config --quiet
